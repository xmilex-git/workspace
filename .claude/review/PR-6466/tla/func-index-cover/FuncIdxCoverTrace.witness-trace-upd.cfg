\* expect: violation TraceNotDone
\* deadlock-off: the trace spec stops after the last logged event; acceptance is consuming the whole log
SPECIFICATION TSpec
CONSTANTS NR = 2  Mutant = "none"  NegZero = FALSE
CONSTANT TraceLog <- UpdTrace
CONSTANT TraceIn <- UpdIn
INVARIANT TraceNotDone
CHECK_DEADLOCK FALSE
