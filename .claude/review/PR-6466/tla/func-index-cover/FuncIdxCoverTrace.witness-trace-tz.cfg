SPECIFICATION TSpec
CONSTANTS NR = 2  Mutant = "none"  NegZero = FALSE
CONSTANT TraceLog <- TzTrace
CONSTANT TraceIn <- TzIn
INVARIANT TraceNotDone
CHECK_DEADLOCK FALSE
