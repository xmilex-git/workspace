\* expect: pass
\* deadlock-off: INIT IndInv starts in every state IndInv allows, including the stuttering cleared state; the check is IndInv /\ Next => IndInv'
INIT IndInv
NEXT Next
CONSTANTS NR = 3  NP = 2  NK = 2  AreaMax = 1  MaxF = 2  SkipFlags = {FALSE}  Faults = TRUE  Mutant = "none"
INVARIANT IndInv
CHECK_DEADLOCK FALSE
