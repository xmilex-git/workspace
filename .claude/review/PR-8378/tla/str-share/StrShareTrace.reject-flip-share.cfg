\* expect: pass
\* deadlock-off: the trace spec stops where the corrupted run leaves the spec; that stop is the rejection
SPECIFICATION TSpec
CONSTANTS MaxPrec = 3  NCols = 12  Rows = 1000  Mutant = "none"  ReevOn = FALSE
CONSTANT TraceLog <- FlipShareTrace
INVARIANT TraceNotDone
CHECK_DEADLOCK FALSE
