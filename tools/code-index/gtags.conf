#
# GNU Global configuration for tools/code-index (decision D10), selected with
# GTAGSCONF=<this file> GTAGSLABEL=code-index. CUBRID compiles its .c files as C++, so .c/.h/.i go to
# the built-in C++ parser; .y/.yy go to the yacc parser, which yields no rules for CUBRID's grammars
# (code_index.py scans the rules itself). Lex files (.l) have no built-in parser; the column-0 scan in
# code_index.py finds their C functions.
#
code-index:\
	:langmap=cpp\:.c.h.i.cpp.hpp,yacc\:.y.yy,java\:.java:
