\* expect: liveness
\* deadlock-off: the thread that sleeps with staged requests leaves a state with no step; it is the liveness failure the claim names, and with the deadlock check on TLC reports whichever of the two it reaches first
SPECIFICATION Spec
CONSTANTS Threads = {t1, t2}  Pages = {p1, p2}  MaxErrors = 1  MaxVictims = 1  MaxRounds = 1  Reaper = "daemon"  Mutant = "block_with_staged"
PROPERTY AllComplete
CHECK_DEADLOCK FALSE
