\* expect: pass
\* deadlock-off: the trace spec stops where the corrupted run leaves the fix; that stop is the rejection
SPECIFICATION TSpec
CONSTANTS NW = 1  NInit = 1  NStmt = 1  VacRounds = 0  H = 2  Isolation = "RC"  TornFix = FALSE  Mutant = "none"
          StatsFix = TRUE  NOps = 2  Prog <- ProgScanCount
CONSTANT TraceLog <- CountFixRun1Corrupt
CONSTANTS IdBase = 91  PosBase = 1  OidsBase = 100
INVARIANT TraceNotDone
CHECK_DEADLOCK FALSE
