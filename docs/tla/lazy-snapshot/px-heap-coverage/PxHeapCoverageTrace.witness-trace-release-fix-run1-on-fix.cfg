\* expect: violation TraceNotDone
\* deadlock-off: hidden steps the run does not log (deletes, vacuum passes) can lead into dead ends; the check is whether some behavior consumes the whole run
SPECIFICATION TSpec
CONSTANTS Workers = {"w1", "w2"}  NPages = 3  NInit = 3  NNew = 0  VacuumRounds = 4  FtabRounds = 1
          SnapshotAt = "query_start"  PtypeCheck = TRUE  Mutant = "none"
CONSTANT TraceLog <- ReleaseFix1
CONSTANT PageIds <- PageIdsF1
INVARIANT TraceNotDone
CHECK_DEADLOCK FALSE
