\* expect: pass
\* deadlock-off: starts from every IndInv state, including those with no execution left; deadlock freedom is checked by ExprProgExec.cfg
INIT IndInv
NEXT Next
CONSTANTS Threads = {t1, t2}  QIDs = {1, 2}  MaxExec = 3  MaxRows = 2  Mutant = "none"
INVARIANT IndInv
CHECK_DEADLOCK FALSE
